[package]
name = "evoio-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }

[dependencies.wee_alloc]
version = "0.4.5"
optional = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
